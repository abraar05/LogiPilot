<div id="auth" class="auth" hidden>
  <div class="auth__bg" aria-hidden="true"></div>
  <main class="auth__card" role="main">
    <header class="auth__brand">
      <span class="auth__logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34"><use href="#glyph" /></svg>
      </span>
      <div>
        <h1>LogiPilot</h1>
        <p>Pack · Approve · Deliver — every step proven</p>
      </div>
    </header>

    <form id="signinForm" class="auth__form" novalidate>
      <div class="seg" role="tablist" aria-label="Sign in options">
        <button type="button" class="seg__btn is-active" data-authtab="password" role="tab" aria-selected="true">Password</button>
        <button type="button" class="seg__btn" data-authtab="pin" role="tab" aria-selected="false">Quick PIN</button>
      </div>

      <div class="field" data-authtabpanel="password">
        <label class="field__label" for="siEmail">Work email</label>
        <input class="input" id="siEmail" name="email" type="email" inputmode="email"
               autocomplete="username" placeholder="you@company.com" required />
        <p class="field__error" data-error-for="siEmail"></p>
      </div>

      <div class="field" data-authtabpanel="password">
        <label class="field__label" for="siPassword">Password</label>
        <div class="input-affix">
          <input class="input" id="siPassword" name="password" type="password"
                 autocomplete="current-password" placeholder="••••••••" required minlength="6" />
          <button class="input-affix__btn" type="button" data-toggle-password="siPassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><use href="#eye" /></svg>
          </button>
        </div>
        <p class="field__error" data-error-for="siPassword"></p>
      </div>

      <div class="auth__row">
        <label class="check check--sm">
          <input type="checkbox" id="siRemember" checked />
          <span class="check__box" aria-hidden="true"></span>
          <span class="check__text">Keep me signed in</span>
        </label>
      </div>

      <div class="pinpad" data-authtabpanel="pin" hidden>
        <p class="pinpad__hint">Select your profile, then enter your 4-digit PIN.</p>
        <div class="pinpad__users" id="pinUsers" role="radiogroup" aria-label="Choose profile"></div>
        <div class="pinpad__display" aria-live="polite">
          <span class="pinpad__dots" id="pinDots" aria-hidden="true"></span>
          <span class="pinpad__name" id="pinName">No profile selected</span>
        </div>
        <div class="pinpad__grid" id="pinGrid">
          <button type="button" class="pinpad__key" data-pin="1">1</button>
          <button type="button" class="pinpad__key" data-pin="2">2</button>
          <button type="button" class="pinpad__key" data-pin="3">3</button>
          <button type="button" class="pinpad__key" data-pin="4">4</button>
          <button type="button" class="pinpad__key" data-pin="5">5</button>
          <button type="button" class="pinpad__key" data-pin="6">6</button>
          <button type="button" class="pinpad__key" data-pin="7">7</button>
          <button type="button" class="pinpad__key" data-pin="8">8</button>
          <button type="button" class="pinpad__key" data-pin="9">9</button>
          <button type="button" class="pinpad__key pinpad__key--ghost" data-pin="clear" aria-label="Clear">C</button>
          <button type="button" class="pinpad__key" data-pin="0">0</button>
          <button type="button" class="pinpad__key pinpad__key--ghost" data-pin="back" aria-label="Delete last digit">⌫</button>
        </div>
      </div>

      <button class="btn btn--primary btn--block btn--lg" type="submit" id="signinSubmit">
        <span class="btn__label">Sign in</span>
      </button>

      <p class="auth__alt">
        No account? <button type="button" class="link" data-action="open-request">Ask your administrator</button>
      </p>
    </form>
  </main>

  <footer class="auth__foot">
    <span>v1.0.0</span>
    <span class="dot">·</span>
    <button type="button" class="link" data-action="toggle-theme">Theme</button>
  </footer>
</div>

<div id="app" class="app" hidden>
  <header class="appbar">
    <button class="appbar__icon appbar__icon--menu" type="button" data-action="toggle-nav" aria-label="Open navigation" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><use href="#menu" /></svg>
    </button>
    <div class="appbar__id">
      <strong id="appbarTitle">Dashboard</strong>
      <span id="appbarSub">—</span>
    </div>
    <div class="appbar__actions">
      <button class="appbar__icon" type="button" data-action="scan" aria-label="Scan code">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><use href="#target" /></svg>
      </button>
      <button class="appbar__icon" type="button" data-action="open-search" aria-label="Search (Ctrl K)">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><use href="#search" /></svg>
      </button>
      <button class="appbar__icon appbar__icon--badge" type="button" data-action="open-alerts" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><use href="#bell" /></svg>
        <span class="appbar__badge" id="alertBadge" hidden>0</span>
      </button>
      <button class="appbar__avatar" type="button" data-action="open-account" aria-label="Account menu">
        <span id="avatarInitials">··</span>
      </button>
    </div>
  </header>

  <nav class="sidenav" id="sidenav" aria-label="Primary">
    <div class="sidenav__brand">
      <span aria-hidden="true"><svg viewBox="0 0 48 48" width="26" height="26"><use href="#glyph" /></svg></span>
      <strong>LogiPilot</strong>
    </div>
    <div class="sidenav__scroll" id="sidenavLinks"></div>
    <div class="sidenav__foot">
      <div class="conn" id="connPill" data-state="snapshot">
        <span class="conn__led"></span>
        <span class="conn__text">Local</span>
      </div>
    </div>
  </nav>
  <div class="scrim" id="navScrim" hidden></div>

  <main class="view" id="view" tabindex="-1">
    <div class="view__inner" id="viewInner"></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<div id="sheetRoot" class="overlay-root"></div>
<div id="modalRoot" class="overlay-root"></div>
<div id="toastRoot" class="toast-root" role="status" aria-live="polite" aria-atomic="false"></div>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="palette__panel">
    <div class="palette__search">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><use href="#search" /></svg>
      <input id="paletteInput" type="text" placeholder="Search orders, customers, actions…" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <kbd>Esc</kbd>
    </div>
    <div class="palette__results" id="paletteResults"></div>
    <div class="palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>Esc</kbd> close</span>
    </div>
  </div>
</div>
